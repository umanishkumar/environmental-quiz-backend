spring.application.name=quiz

# --- Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/environmental_quiz_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080
# --- JWT ---
app.jwt.secret=${JWT_SECRET} 
app.jwt.expiration-ms=86400000

# --- Spring AI ---
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b


# --- AI Fallback / RAG (real OpenAI — used only for embeddings) ---
openai.fallback.api-key=${OPENAI_API_KEY:}
openai.embedding.model=text-embedding-3-small

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG